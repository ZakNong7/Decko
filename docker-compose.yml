version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: decko_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decko
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: decko_server
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DATABASE_URL: postgres://postgres:postgres@db:5432/decko
      JWT_SECRET: decko_secret_jwt_key_123_456
      CLIENT_URL: http://localhost:5173
    depends_on:
      - db

  client:
    build: ./client
    container_name: decko_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
